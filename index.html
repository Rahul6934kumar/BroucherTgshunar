<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trinity Global School – Digital Brochure</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #cbd5e1; /* Smooth grey background */
        font-family: "Poppins", sans-serif;
        overflow: hidden;
      }

      /* Responsive Container */
      #book-container {
        width: 95vw;
        height: 80vh;
        max-width: 1000px; /* Desktop width for 2 pages */
        max-height: 700px;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      #book {
        width: 100%;
        height: 100%;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
      }

      .page {
        background-color: white;
        overflow: hidden;
      }

      .page img {
        width: 100%;
        height: 100%;
        object-fit: fill; /* Ensures image fills the page area */
        display: block;
      }

      /* 3D CENTER SHADOW EFFECT (Spine) */
      /* This only shows when two pages are side-by-side */
      .page::after {
        content: "";
        position: absolute;
        top: 0;
        width: 60px;
        height: 100%;
        z-index: 10;
        pointer-events: none;
      }

      /* Left Page Shadow (Right Edge) */
      .page:nth-child(odd)::after {
        right: 0;
        background: linear-gradient(
          to left,
          rgba(0, 0, 0, 0.3) 0%,
          rgba(0, 0, 0, 0.05) 15%,
          transparent 100%
        );
      }

      /* Right Page Shadow (Left Edge) */
      .page:nth-child(even)::after {
        left: 0;
        background: linear-gradient(
          to right,
          rgba(0, 0, 0, 0.3) 0%,
          rgba(0, 0, 0, 0.05) 15%,
          transparent 100%
        );
      }

      /* Mobile Fix: Hide center shadows and adjust height on small screens */
      @media (max-width: 768px) {
        #book-container {
          width: 90vw;
          height: 70vh;
          max-width: 450px; /* Mobile width for 1 page */
        }
        .page::after {
          display: none !important; /* No center fold on single page view */
        }
      }

      .welcome-page {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 20px;
        text-align: center;
      }

      .corner-btn {
        position: fixed;
        top: 20px;
        right: 20px;
        background: #1d4ed8;
        color: white;
        padding: 10px 25px;
        border-radius: 50px;
        text-decoration: none;
        font-weight: 600;
        font-size: 14px;
        z-index: 1000;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      }

      .corner-btn:hover {
        background: #1e40af;
        color: white;
      }
    </style>
  </head>

  <body>
    <a href="https://trinityglobalschool.com/" class="corner-btn"
      >Back to TGS</a
    >

    <div id="book-container">
      <div id="book">
        <!-- PAGE 1: Welcome -->
        <div class="page welcome-page">
          <h2 style="color: #1d4ed8; font-weight: 700">
            Trinity Global School
          </h2>
          <div
            style="
              width: 50px;
              height: 2px;
              background: #1d4ed8;
              margin: 15px 0;
            "
          ></div>
          <p style="color: #64748b; font-style: italic">
            Digital Brochure 2024
          </p>
        </div>

        <!-- IMAGE PAGES -->
        <div class="page"><img src="brochure_images/img1/1.jpg" alt="1" /></div>
        <div class="page"><img src="brochure_images/img1/2.jpg" alt="2" /></div>
        <div class="page"><img src="brochure_images/img1/3.jpg" alt="3" /></div>
        <div class="page"><img src="brochure_images/img1/4.jpg" alt="4" /></div>
        <div class="page"><img src="brochure_images/img1/5.jpg" alt="5" /></div>
        <div class="page"><img src="brochure_images/img1/6.jpg" alt="6" /></div>
        <div class="page"><img src="brochure_images/img1/7.jpg" alt="7" /></div>
        <div class="page"><img src="brochure_images/img1/8.jpg" alt="8" /></div>
        <div class="page"><img src="brochure_images/img1/9.jpg" alt="9" /></div>
        <div class="page">
          <img src="brochure_images/img1/10.jpg" alt="10" />
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>

    <script>
      window.addEventListener("load", function () {
        const flipSound = new Audio("brochure_images/page_flip.mp3");

        const pageFlip = new St.PageFlip(document.getElementById("book"), {
          width: 450, // base page width
          height: 600, // base page height
          size: "stretch", // IMPORTANT for responsiveness
          minWidth: 300,
          maxWidth: 1000,
          minHeight: 400,
          maxHeight: 700,
          showCover: false,
          mobileScrollSupport: true,
          useMouseEvents: true,
          flippingTime: 800,
          drawShadow: false, // Turn off built-in shadow to avoid outer edge artifacts
          usePortrait: true, // Automatically switches to 1-page view on Mobile
          startPage: 0,
        });

        pageFlip.loadFromHTML(document.querySelectorAll(".page"));

        pageFlip.on("flip", (e) => {
          // flipSound.currentTime = 0;
          // flipSound
          //   .play()
          //   .catch(() => console.log("Sound muted - need user interaction"));
        });
      });
    </script>
  </body>
</html>
